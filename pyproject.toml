[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pprof-analyzer"
version = "0.1.0"
description = "Analyzer for CPU profiles with LLM-powered optimization suggestions"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]~=2.1.1",
    "GitPython~=3.1.59",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["skill*", "mcp_tools*"]
exclude = ["action*", "node_modules*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["action/scripts/tests", "mcp_tools/tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
addopts = "-v --tb=short"

[tool.pylance]
pythonPath = "."
